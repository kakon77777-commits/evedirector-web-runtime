name: EveDirector Programmatic L4 Review R2 (Candidate)

on:
  push:
    paths:
      - '.github/workflows/evedirector-programmatic-r2.yml'
      - 'backlot/__init__.py'
      - 'backlot/programmatic_review.py'
      - 'backlot/ui/agent-review.js'
      - 'backlot/ui/agent-review.css'
      - 'scripts/evedirector_review_stage.py'
      - 'scripts/evedirector_remotion_bridge.py'
      - 'scripts/evedirector_r1_vectors.py'
      - 'scripts/evedirector_programmatic.py'
      - 'tests/test_evedirector_programmatic_review_r2.py'
      - 'tests/test_evedirector_remotion_bridge.py'
      - 'tests/test_backlot_agent_review.py'
      - 'remotion/**'
      - 'examples/native-video/**'
      - 'styles/evemiss-native-demo.yaml'
  pull_request:
    paths:
      - '.github/workflows/evedirector-programmatic-r2.yml'
      - 'backlot/**'
      - 'scripts/evedirector_review_stage.py'
      - 'tests/test_evedirector_programmatic_review_r2.py'
      - 'remotion/**'
      - 'examples/native-video/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  programmatic-l4-r2:
    name: Source replay + L4 read-only security + real Remotion staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local-first dependencies
        run: |
          python -m pip install -U pip
          python -m pip install 'Pillow>=10' 'PyYAML>=6' 'fastapi>=0.110' 'uvicorn>=0.29' 'watchfiles>=0.21' 'pytest>=8' 'httpx>=0.27' 'pydantic>=2' 'jsonschema>=4' 'python-dotenv>=1' 'requests>=2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Regress R0 and R1 isolated Python contracts
        run: |
          python -m unittest discover -s tests -p 'test_evedirector_programmatic.py' -v
          python -m unittest discover -s tests -p 'test_evedirector_remotion_bridge.py' -v
      - name: L4 existing and R2 new security contracts
        run: python -m pytest -q tests/test_backlot_agent_review.py tests/test_evedirector_programmatic_review_r2.py
      - name: Validate browser module syntax
        run: node --input-type=module --check < backlot/ui/agent-review.js
      - name: Export, replay and generate reference vectors
        run: |
          python scripts/evedirector_remotion_bridge.py export \
            --plan examples/native-video/program.json \
            --source examples/native-video/source/README.md \
            --props generated/remotion-props.json \
            --receipt generated/remotion-bridge-receipt.json
          python scripts/evedirector_remotion_bridge.py verify \
            --plan examples/native-video/program.json \
            --source examples/native-video/source/README.md \
            --props generated/remotion-props.json \
            --receipt generated/remotion-bridge-receipt.json
          python scripts/evedirector_r1_vectors.py
      - name: Install isolated Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Compile/test TypeScript and Python reference vectors
        working-directory: remotion
        run: |
          ./node_modules/.bin/tsc --target ES2020 --module commonjs --strict \
            --skipLibCheck --outDir /tmp/evedirector-r2-core src/SceneProgramCore.ts
          node tests/test_core.cjs /tmp/evedirector-r2-core/SceneProgramCore.js \
            ../generated/remotion-props.json ../generated/interpolation_vectors.json
          npm run typecheck
      - name: Render real Remotion candidate
        working-directory: remotion
        run: |
          ./node_modules/.bin/remotion browser ensure
          npm run render
      - name: Stage R2 candidate into isolated project
        run: |
          mkdir -p projects/r2-ci-demo
          python scripts/evedirector_review_stage.py stage \
            --project-id r2-ci-demo --candidate-id ci_r2 \
            --plan examples/native-video/program.json \
            --source examples/native-video/source/README.md \
            --styles-dir styles --video remotion/out/native-r1.mp4
          python scripts/evedirector_review_stage.py verify \
            --project-id r2-ci-demo --candidate-id ci_r2
      - name: Smoke test L4 index/detail/player and prohibited Apply
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backlot.server import create_app
          with TestClient(create_app()) as c:
              root = '/api/project/r2-ci-demo/programmatic-review'
              listing = c.get(root)
              assert listing.status_code == 200, listing.text
              assert listing.json()['candidates'][0]['apply_supported'] is False
              detail = c.get(root + '/ci_r2')
              assert detail.status_code == 200, detail.text
              assert detail.json()['preview']['available'] is True
              assert detail.json()['preview']['visual_equivalence_attested'] is False
              assert len(detail.json()['scenes']) == 2
              mp4 = c.get(root + '/ci_r2/media')
              assert mp4.status_code == 200, mp4.status_code
              assert mp4.headers['content-type'].startswith('video/mp4')
              assert c.post(root + '/ci_r2/apply', json={'confirmation':'APPLY ci_r2'}).status_code == 404
              print('R2: L4 read-only indexed source candidate with playable MP4; NO Apply route')
          PY
      - name: Upload candidate package for review (not a publication release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-r2-l4-review-candidate
          path: |
            projects/r2-ci-demo/programmatic_candidates/ci_r2/manifest.json
            projects/r2-ci-demo/programmatic_candidates/ci_r2/receipt.json
            projects/r2-ci-demo/programmatic_candidates/ci_r2/preview.mp4
          retention-days: 7
