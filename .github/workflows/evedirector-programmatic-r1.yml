name: EveDirector Programmatic Remotion R1 (Candidate)

on:
  push:
    paths:
      - '.github/workflows/evedirector-programmatic-r1.yml'
      - 'scripts/evedirector_remotion_bridge.py'
      - 'scripts/evedirector_r1_vectors.py'
      - 'scripts/evedirector_programmatic.py'
      - 'tests/test_evedirector_remotion_bridge.py'
      - 'tests/test_evedirector_programmatic.py'
      - 'remotion/**'
      - 'styles/evemiss-native-demo.yaml'
      - 'examples/native-video/**'
  pull_request:
    paths:
      - '.github/workflows/evedirector-programmatic-r1.yml'
      - 'scripts/evedirector_remotion_bridge.py'
      - 'scripts/evedirector_r1_vectors.py'
      - 'tests/test_evedirector_remotion_bridge.py'
      - 'remotion/**'
      - 'styles/evemiss-native-demo.yaml'
      - 'examples/native-video/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-r1:
    name: R0/R1 contracts + real candidate Remotion render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zero-key dependencies
        run: |
          python -m pip install 'Pillow>=10' 'PyYAML>=6'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Python R0 regression
        run: python -m unittest discover -s tests -p 'test_evedirector_programmatic.py' -v
      - name: Python R1 bridge regression
        run: python -m unittest discover -s tests -p 'test_evedirector_remotion_bridge.py' -v
      - name: Export source-derived props and receipt
        run: |
          python scripts/evedirector_remotion_bridge.py export \
            --plan examples/native-video/program.json \
            --source examples/native-video/source/README.md \
            --props generated/remotion-props.json \
            --receipt generated/remotion-bridge-receipt.json
      - name: Verify source, program, palette, props and receipt
        run: |
          python scripts/evedirector_remotion_bridge.py verify \
            --plan examples/native-video/program.json \
            --source examples/native-video/source/README.md \
            --props generated/remotion-props.json \
            --receipt generated/remotion-bridge-receipt.json
      - name: Produce independent R0 interpolation reference
        run: python scripts/evedirector_r1_vectors.py
      - name: Install isolated Remotion toolchain
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: TypeScript Core and cross-backend Node tests
        working-directory: remotion
        run: |
          mkdir -p /tmp/evedirector-r1-core
          ./node_modules/.bin/tsc --target ES2020 --module commonjs --strict --skipLibCheck \
            --outDir /tmp/evedirector-r1-core src/SceneProgramCore.ts
          node tests/test_core.cjs /tmp/evedirector-r1-core/SceneProgramCore.js \
            ../generated/remotion-props.json ../generated/interpolation_vectors.json
      - name: Remotion full typecheck
        working-directory: remotion
        run: npm run typecheck
      - name: Ensure local Chromium render engine
        working-directory: remotion
        run: ./node_modules/.bin/remotion browser ensure
      - name: Render candidate-only video
        working-directory: remotion
        run: npm run render
      - name: FFprobe H264 and frame count
        run: |
          python - <<'PY'
          import json
          import subprocess
          result = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-count_frames',
              '-show_entries', 'stream=codec_name,width,height,r_frame_rate,nb_read_frames',
              '-select_streams', 'v:0', '-of', 'json', 'remotion/out/native-r1.mp4',
          ], text=True))
          stream = result['streams'][0]
          assert stream['codec_name'] == 'h264', stream
          assert (stream['width'], stream['height']) == (640, 360), stream
          assert stream['r_frame_rate'] == '12/1', stream
          assert stream['nb_read_frames'] == '60', stream
          print('R1_REMOTION_MP4: CI candidate verified; NOT human approved; NOT L0-L6 acceptance')
          PY
      - name: Upload local CI candidate (not publication release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-r1-remotion-candidate
          path: remotion/out/native-r1.mp4
          retention-days: 7
