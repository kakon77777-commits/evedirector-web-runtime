name: EveDirector R9 AI Drawing Plugin Host (Candidate)

on:
  push:
    paths:
      - '.github/workflows/evedirector-plugin-r9.yml'
      - 'scripts/evedirector_plugin_hub.py'
      - 'plugins/evedirector/**'
      - 'backlot/server.py'
      - 'backlot/ui/plugin-hub.*'
      - 'backlot/ui/agent-review.js'
      - 'tests/test_evedirector_plugin_*_r9.py'
      - 'examples/native-video/plugins/**'
  pull_request:
    paths:
      - '.github/workflows/evedirector-plugin-r9.yml'
      - 'scripts/evedirector_plugin_hub.py'
      - 'plugins/evedirector/**'
      - 'backlot/server.py'
      - 'backlot/ui/plugin-hub.*'
      - 'backlot/ui/agent-review.js'
      - 'tests/test_evedirector_plugin_*_r9.py'
      - 'examples/native-video/plugins/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r9-plugin-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Registry, bounded execution, ORDR DTO, EVOE mock, Backlot UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install first-party host test requirements (no private engines)
        run: |
          python -m pip install 'Pillow>=10' 'PyYAML>=6' 'fastapi>=0.110' 'uvicorn>=0.29' 'watchfiles>=0.21' 'httpx>=0.27' 'pytest>=8' 'pydantic>=2' 'jsonschema>=4' 'python-dotenv>=1' 'requests>=2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check existing native R0 regression
        run: python -m unittest discover -s tests -p 'test_evedirector_programmatic.py' -v
      - name: R9 plugin security, native MP4, ORDR and mock EVOE
        run: python -m unittest discover -s tests -p 'test_evedirector_plugin_*_r9.py' -v
      - name: Browser catalog JavaScript and legacy L4 syntax
        run: |
          node --input-type=module --check < backlot/ui/plugin-hub.js
          node --input-type=module --check < backlot/ui/agent-review.js
      - name: Demonstrate fixed built-in and ORDR calls with verifiable receipts
        run: |
          mkdir -p output/plugin-r9
          python scripts/evedirector_plugin_hub.py catalog > output/plugin-r9/catalog.json
          python scripts/evedirector_plugin_hub.py run --request examples/native-video/plugins/native-r0.request.json --input-root examples/native-video --output-root output/plugin-r9
          python scripts/evedirector_plugin_hub.py verify --run-dir output/plugin-r9/native_demo_r9 > output/plugin-r9/native_verify.json
          python scripts/evedirector_plugin_hub.py run --request examples/native-video/plugins/ordr-snapshot.request.json --input-root examples/native-video --output-root output/plugin-r9
          python scripts/evedirector_plugin_hub.py verify --run-dir output/plugin-r9/ordr_snapshot_demo_r9 > output/plugin-r9/ordr_verify.json
          python scripts/evedirector_plugin_hub.py doctor --plugin evoe > output/plugin-r9/evoe_doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/plugin-r9')
          doctor=json.loads((root/'evoe_doctor.json').read_text(encoding='utf-8'))
          assert doctor['available'] is False, 'CI intentionally has no private EVOE source'
          for name in ('native_verify.json','ordr_verify.json'):
              data=json.loads((root/name).read_text(encoding='utf-8'))
              assert data['status']=='PASS_BOUNDED_REPLAY',data
          print('R9: native MP4 and read-only ORDR contract PASS. EVOE MOCK contract PASS; REAL EVOE NOT CONNECTED in CI.')
          PY
      - name: Upload R9 source, examples and receipts; not private engines
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-r9-plugin-host-candidate
          retention-days: 7
          path: |
            LICENSE
            scripts/evedirector_plugin_hub.py
            plugins/evedirector/**
            backlot/server.py
            backlot/ui/plugin-hub.*
            backlot/ui/agent-review.js
            tests/test_evedirector_plugin_*_r9.py
            examples/native-video/plugins/**
            docs/EVEDIRECTOR_AI_DRAWING_PLUGIN_HOST_R9_2026-11-15_zh-TW.md
            output/plugin-r9/**
