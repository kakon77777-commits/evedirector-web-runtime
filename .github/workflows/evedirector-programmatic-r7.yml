name: EveDirector Programmatic Platform R7 (Candidate)
on:
  push:
    paths:
      - '.github/workflows/evedirector-programmatic-r7.yml'
      - 'scripts/evedirector_platform_layout_r7.py'
      - 'tests/test_evedirector_platform_layout_r7.py'
      - 'examples/native-video/r7-platform-layout-request.json'
  pull_request:
    paths:
      - '.github/workflows/evedirector-programmatic-r7.yml'
      - 'scripts/evedirector_platform_layout_r7.py'
      - 'tests/test_evedirector_platform_layout_r7.py'
      - 'examples/native-video/r7-platform-layout-request.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-r7:
    name: R7 3-aspect candidate video and source-grounded layout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zero-key media and font dependencies
        run: |
          python -m pip install 'Pillow>=10' 'PyYAML>=6' 'fonttools>=4.55' 'fastapi>=0.110' 'uvicorn>=0.29' 'watchfiles>=0.21' 'pytest>=8' 'httpx>=0.27' 'pydantic>=2' 'jsonschema>=4' 'python-dotenv>=1' 'requests>=2'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk fontconfig
      - name: R0 R1 R6 R7 regressions
        run: |
          python -m unittest discover -s tests -p test_evedirector_programmatic.py -v
          python -m unittest discover -s tests -p test_evedirector_remotion_bridge.py -v
          python -m pytest -q tests/test_evedirector_subtitle_layout_r6.py tests/test_evedirector_platform_layout_r7.py
      - name: Check all 6 presets with R6 pinned-font layout
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import evedirector_platform_layout_r7 as r7
          p=Path('examples/native-video/r7-platform-layout-request.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          r['profiles']=sorted(r7.PROFILES)
          Path('/tmp/all_profiles.json').write_text(json.dumps(r,ensure_ascii=False),encoding='utf-8')
          PY
          python scripts/evedirector_platform_layout_r7.py compile --base examples/native-video/r6-layout-base.json --source examples/native-video/source/r6-subtitle-layout.md --request /tmp/all_profiles.json --out generated/r7-six
          python scripts/evedirector_platform_layout_r7.py verify --base examples/native-video/r6-layout-base.json --source examples/native-video/source/r6-subtitle-layout.md --request /tmp/all_profiles.json --out generated/r7-six
      - name: Source-grounded three-profile compile + verify
        run: |
          python scripts/evedirector_platform_layout_r7.py compile --base examples/native-video/r6-layout-base.json --source examples/native-video/source/r6-subtitle-layout.md --request examples/native-video/r7-platform-layout-request.json --out generated/r7-variants
          python scripts/evedirector_platform_layout_r7.py verify --base examples/native-video/r6-layout-base.json --source examples/native-video/source/r6-subtitle-layout.md --request examples/native-video/r7-platform-layout-request.json --out generated/r7-variants
      - name: Remotion install
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Legacy 175 Python/TypeScript interpolation vectors
        run: |
          python scripts/evedirector_r1_vectors.py
          python scripts/evedirector_remotion_bridge.py export --plan examples/native-video/program.json --source examples/native-video/source/README.md --props generated/legacy-r1-props.json --receipt generated/legacy-r1-receipt.json
          cd remotion
          mkdir -p /tmp/r7-core
          ./node_modules/.bin/tsc --target ES2020 --module commonjs --strict --skipLibCheck --outDir /tmp/r7-core src/SceneProgramCore.ts
          node tests/test_core.cjs /tmp/r7-core/SceneProgramCore.js ../generated/legacy-r1-props.json ../generated/interpolation_vectors.json
      - name: Ensure Chromium
        working-directory: remotion
        run: ./node_modules/.bin/remotion browser ensure
      - name: Render and source-replay R7 square vertical horizontal
        run: |
          mkdir -p projects/r7-ci-demo generated/r7-rendered
          for id in square_social_v1 tiktok_vertical_v1 youtube_landscape_v1; do
            python scripts/evedirector_remotion_bridge.py export --force --plan "generated/r7-variants/$id.plan.json" --source examples/native-video/source/r6-subtitle-layout.md --props generated/remotion-props.json --receipt generated/remotion-bridge-receipt.json
            python scripts/evedirector_remotion_bridge.py verify --plan "generated/r7-variants/$id.plan.json" --source examples/native-video/source/r6-subtitle-layout.md --props generated/remotion-props.json --receipt generated/remotion-bridge-receipt.json
            (cd remotion && npm run typecheck && npm run render)
            cp remotion/out/native-r1.mp4 "generated/r7-rendered/$id.mp4"
            python scripts/evedirector_review_stage.py stage --project-id r7-ci-demo --candidate-id "r7_$id" --plan "generated/r7-variants/$id.plan.json" --source examples/native-video/source/r6-subtitle-layout.md --styles-dir styles --video "generated/r7-rendered/$id.mp4"
            python scripts/evedirector_subtitle_layout_r6.py stage --project-id r7-ci-demo --candidate-id "r7_$id" --base "generated/r7-variants/$id.base.json" --layout "generated/r7-variants/$id.r6-request.json"
            python scripts/evedirector_subtitle_layout_r6.py replay --project-id r7-ci-demo --candidate-id "r7_$id"
          done
      - name: Verify L4 GET playback and no Apply for all 3 variants
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backlot.server import create_app
          with TestClient(create_app()) as c:
            for name,w,h in [('square_social_v1',540,540),('tiktok_vertical_v1',360,640),('youtube_landscape_v1',640,360)]:
              root='/api/project/r7-ci-demo/programmatic-review/r7_'+name
              response=c.get(root)
              assert response.status_code==200,response.text
              d=response.json()
              assert d['timing']['width']==w and d['timing']['height']==h
              assert d['layout_check']['status']=='PASS_SAFE_LAYOUT_CONTRACT'
              assert d['authority']['apply_supported'] is False
              assert d['preview']['available'] is True
              assert c.get(root+'/media').status_code==200
              assert c.post(root+'/apply',json={'confirmation':'APPLY'}).status_code==404
              print('R7_CI',name,w,h,'PASS preview only')
          PY
      - name: Upload candidate source and 3 real MP4; no fonts and no release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: evedirector-r7-platform-candidate-kit
          retention-days: 7
          path: |
            LICENSE
            README.md
            docs/UPSTREAM_README.md
            docs/EVEDIRECTOR_PROGRAMMATIC_VIDEO_R*_2026-11-15_zh-TW.md
            scripts/evedirector_programmatic.py
            scripts/evedirector_remotion_bridge.py
            scripts/evedirector_review_stage.py
            scripts/evedirector_r1_vectors.py
            scripts/evedirector_multilang_probe_r5.py
            scripts/evedirector_subtitle_layout_r6.py
            scripts/evedirector_platform_layout_r7.py
            backlot/programmatic_review.py
            backlot/server.py
            backlot/ui/agent-review.js
            remotion/README.md
            remotion/package.json
            remotion/tsconfig.json
            remotion/src/**
            remotion/tests/**
            tests/test_evedirector_*.py
            examples/native-video/**
            styles/evemiss-native-demo.yaml
            generated/r7-six/**
            generated/r7-variants/**
            generated/r7-rendered/**
            projects/r7-ci-demo/programmatic_candidates/**
            projects/r7-ci-demo/programmatic_layout_checks/**
